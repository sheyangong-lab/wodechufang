# 共享厨房公网部署：Caddy 自动 HTTPS 反代 + 服务端容器
#
# 快速开始：
#   1. 把 YOUR_DOMAIN 换成你的域名（DNS A 记录指到这台机器 80/443 端口）
#   2. 设置密钥：  export JWT_SECRET=$(openssl rand -base64 48)
#                  export GLM_API_KEY=你的智谱Key（可选，账本票据识别用）
#   3. 启动：      docker compose up -d --build
#   4. 验证：      curl https://YOUR_DOMAIN/api/health
#
# 数据都在 named volume（server-data），备份=备份该卷；升级=git pull && docker compose up -d --build。
# 管理后台：https://YOUR_DOMAIN/admin/

name: shared-kitchen

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 挑战 + 跳转 HTTPS
      - "443:443"
    environment:
      # 部署时替换域名（.env 文件或 export DOMAIN=...）
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data    # 证书持久化
      - caddy-config:/config
    depends_on:
      server:
        condition: service_started

  server:
    build: ./server
    restart: unless-stopped
    # 不直接暴露 8080 到宿主机：只走 Caddy 内网。调试时临时放开注释即可。
    # ports:
    #   - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}   # dev=内置SQLite；prod=外部Postgres
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 或环境变量里设置 JWT_SECRET}
      GLM_API_KEY: ${GLM_API_KEY:-}
      # prod 档外部数据库（选用 prod 时必填）：
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - server-data:/app/data   # SQLite库 + uploads图片 + apk更新包
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/health || exit 1"]

  # 选用 Postgres 时：SPRING_PROFILES_ACTIVE=prod 且填 DB_URL/DB_USER/DB_PASSWORD
  #   DB_URL=jdbc:postgresql://db:5432/sharedkitchen
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      POSTGRES_DB: sharedkitchen
      POSTGRES_USER: ${DB_USER:-sharedkitchen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-if-prod}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  server-data:
  caddy-data:
  caddy-config:
  db-data:
