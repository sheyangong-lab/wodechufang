spring:
  application:
    name: shared-kitchen-server
  profiles:
    default: dev
  # 启动时加载 server/.env（properties 格式，如 GLM_API_KEY=xxx），系统环境变量优先级更高
  config:
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 表结构一律由 Flyway 管理
server:
  port: 8080

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-32bytes-minimum!!}
  ttl-hours: 72

glm:
  # 账本 AI 识别（智谱开放平台 https://open.bigmodel.cn），Key 通过环境变量注入，未配置时识别接口报提示错误
  api-key: ${GLM_API_KEY:}
  model: ${GLM_MODEL:glm-5.3-flash}
  base-url: ${GLM_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
  timeout-ms: 60000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlite:./data/sharedkitchen.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sharedkitchen}
    username: ${DB_USER:sharedkitchen}
    password: ${DB_PASSWORD:}
