spring:
  application:
    name: shared-kitchen-server
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration/{vendor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 表结构一律由 Flyway 管理
server:
  port: 8080

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-32bytes-minimum!!}
  ttl-hours: 72

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlite:./data/sharedkitchen.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sharedkitchen}
    username: ${DB_USER:sharedkitchen}
    password: ${DB_PASSWORD:}
