<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共享厨房 · 管理后台</title>
<style>
  :root { --bg:#FFF8F2; --card:#fff; --amber:#EFA63C; --amber-d:#E0A93C; --title:#3D3325; --sub:#8C7F6A; --line:#F0E7D8; --danger:#E05B4E; --green:#5BA47C; --orange:#E8842E; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:var(--bg); color:var(--title); min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:8px 0 20px; }
  .card { background:var(--card); border-radius:16px; box-shadow:0 2px 8px rgba(200,160,80,.1); padding:20px; margin-bottom:16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  input, select { border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; color:var(--title); outline:none; }
  input:focus { border-color:var(--amber); }
  button { border:none; border-radius:10px; padding:9px 18px; font-size:14px; cursor:pointer; background:var(--amber); color:#fff; }
  button:hover { background:var(--amber-d); }
  button.ghost { background:#fff; color:var(--title); border:1px solid var(--line); }
  button.danger { background:#fff; color:var(--danger); border:1px solid var(--danger); }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-weight:500; }
  .tag { display:inline-block; font-size:12px; border-radius:6px; padding:2px 8px; }
  .tag.on { background:#e9f3ec; color:var(--green); }
  .tag.off { background:#fff5f3; color:var(--danger); }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { flex:1; min-width:120px; background:var(--card); border-radius:16px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(200,160,80,.1); }
  .stat b { display:block; font-size:24px; margin-top:4px; }
  .stat span { font-size:12px; color:var(--sub); }
  .muted { color:var(--sub); font-size:12px; }
  #login-view { max-width:360px; margin:12vh auto 0; }
  #login-view h1 { text-align:center; }
  #login-view .card input { width:100%; margin-bottom:12px; }
  #login-view .card button { width:100%; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { background:#fff; color:var(--title); border:1px solid var(--line); }
  .tabs button.on { background:var(--amber); color:#fff; border-color:var(--amber); }
  .toolbar { display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .hide { display:none; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--title); color:#fff; padding:10px 22px; border-radius:20px; font-size:14px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 登录 -->
  <div id="login-view">
    <h1>🍳 共享厨房 · 管理后台</h1>
    <div class="card">
      <input id="lg-user" placeholder="账号">
      <input id="lg-pass" type="password" placeholder="密码">
      <button onclick="login()">登 录</button>
      <p class="muted" style="margin-top:10px;text-align:center">默认账号 admin / admin123（生产务必改密）</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-view" class="hide">
    <h1>🍳 共享厨房 · 管理后台</h1>
    <div class="tabs">
      <button class="on" data-v="overview" onclick="switchTab('overview', this)">概览</button>
      <button data-v="kitchens" onclick="switchTab('kitchens', this)">厨房</button>
      <button data-v="users" onclick="switchTab('users', this)">用户</button>
      <button class="ghost" style="margin-left:auto" onclick="logout()">退出</button>
    </div>

    <div id="t-overview">
      <div class="stats" id="overview-stats"></div>
    </div>

    <div id="t-kitchens" class="hide">
      <div class="card">
        <div class="toolbar">
          <input id="k-kw" placeholder="按名称/厨房码/店长搜索">
          <button onclick="loadKitchens()">搜索</button>
        </div>
        <table id="k-table">
          <thead><tr><th>ID</th><th>名称</th><th>厨房码</th><th>店长</th><th>成员</th><th>状态</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div id="t-users" class="hide">
      <div class="card">
        <div class="toolbar">
          <input id="u-kw" placeholder="按昵称/手机号/标识搜索">
          <button onclick="loadUsers()">搜索</button>
        </div>
        <table id="u-table">
          <thead><tr><th>ID</th><th>昵称</th><th>手机号</th><th>积分</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let TOKEN = sessionStorage.getItem('adminToken') || '';

const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
async function api(method, path, body) {
  const res = await fetch('/api/admin' + path, {
    method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json();
  if (res.status === 401) { showLogin(); throw new Error(json.message || '请先登录'); }
  if (json.code !== 0) { toast(json.message || '操作失败'); throw new Error(json.message); }
  return json.data;
}
function showLogin() { $('login-view').classList.remove('hide'); $('main-view').classList.add('hide'); }
function showMain() { $('login-view').classList.add('hide'); $('main-view').classList.remove('hide'); }
function logout() { TOKEN = ''; sessionStorage.removeItem('adminToken'); showLogin(); }

async function login() {
  try {
    const data = await api('POST', '/login', { username: $('lg-user').value.trim(), password: $('lg-pass').value });
    TOKEN = data.token; sessionStorage.setItem('adminToken', TOKEN);
    showMain(); boot();
  } catch (e) { /* toast 已弹出 */ }
}

function switchTab(v, btn) {
  document.querySelectorAll('.tabs button[data-v]').forEach(b => b.classList.toggle('on', b === btn));
  ['overview','kitchens','users'].forEach(t => $('t-' + t).classList.toggle('hide', t !== v));
  if (v === 'overview') loadOverview();
  if (v === 'kitchens') loadKitchens();
  if (v === 'users') loadUsers();
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot() {
  loadOverview();
}

async function loadOverview() {
  const o = await api('GET', '/overview');
  $('overview-stats').innerHTML = [
    ['注册用户', o.users], ['厨房总数', o.kitchens],
  ].map(([l, v]) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');
}

async function loadKitchens() {
  const kw = $('k-kw').value.trim();
  const list = await api('GET', '/kitchens' + (kw ? '?keyword=' + encodeURIComponent(kw) : ''));
  $('k-table').querySelector('tbody').innerHTML = list.map(k => `
    <tr>
      <td>${k.id}</td><td>${esc(k.name)}</td><td>${esc(k.code.slice(0,16))}…</td><td>${esc(k.ownerNickname)}</td>
      <td>${k.memberCount}</td>
      <td>${k.status === 1 ? '<span class="tag on">正常</span>' : '<span class="tag off">封禁</span>'}</td>
      <td>
        <button class="${k.status === 1 ? 'danger' : 'ghost'}" style="padding:4px 10px;font-size:12px" onclick="banKitchen(${k.id}, ${k.status === 1})">${k.status === 1 ? '封禁' : '解封'}</button>
      </td>
    </tr>`).join('');
}
async function banKitchen(id, ban) {
  if (ban && !confirm('确定封禁该厨房？成员将被拦截')) return;
  await api('POST', `/kitchens/${id}/ban`, { ban });
  toast(ban ? '已封禁' : '已解封'); loadKitchens();
}

async function loadUsers() {
  const kw = $('u-kw').value.trim();
  const list = await api('GET', '/users' + (kw ? '?keyword=' + encodeURIComponent(kw) : ''));
  $('u-table').querySelector('tbody').innerHTML = list.map(u => `
    <tr>
      <td>${u.id}</td><td>${esc(u.nickname)}</td><td>${esc(u.phone)}</td><td>${u.points}</td>
      <td>${u.status === 1 ? '<span class="tag on">正常</span>' : '<span class="tag off">封禁</span>'}</td>
      <td>${esc((u.createdAt || '').slice(0, 10))}</td>
      <td>
        <button class="${u.status === 1 ? 'danger' : 'ghost'}" style="padding:4px 10px;font-size:12px" onclick="banUser(${u.id}, ${u.status === 1})">${u.status === 1 ? '封禁' : '解封'}</button>
        <button class="ghost" style="padding:4px 10px;font-size:12px" onclick="giftPoints(${u.id})">送积分</button>
      </td>
    </tr>`).join('');
}
async function banUser(id, ban) {
  if (ban && !confirm('确定封禁该用户？')) return;
  await api('POST', `/users/${id}/ban`, { ban });
  toast(ban ? '已封禁' : '已解封'); loadUsers();
}
async function giftPoints(id) {
  const p = Number(prompt('赠送积分（负数为扣减）:', '66'));
  if (!p) return;
  await api('POST', `/users/${id}/points`, { points: p });
  toast('已操作'); loadUsers();
}

if (TOKEN) { showMain(); loadOverview(); } else { showLogin(); }
</script>
</body>
</html>
